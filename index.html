<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descargador Pro</title>
<style>
  :root {
    --bg: #0d0d12; --card: #17171f; --card-2: #1f1f29;
    --border: #2a2a38; --text: #f5f5f7; --muted: #9a9aae;
    --accent: #ff2d55; --accent-2: #ff4081; --success: #34c759;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .container { width: 100%; max-width: 580px; }
  .card {
    background: linear-gradient(145deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 24px;
    padding: 36px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { text-align: center; margin-bottom: 6px; }
  .logo h1 {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
  input[type="text"] {
    flex: 1; background: #0a0a0f; border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px; color: var(--text);
    font-size: 15px; outline: none; transition: border-color .2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: #5a5a6e; }
  .btn {
    border: none; border-radius: 14px; padding: 14px 22px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .1s, opacity .2s; color: #fff; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .btn-download { background: linear-gradient(90deg, #5856d6, #007aff); width: 100%; padding: 14px; font-size: 16px; }
  .btn-download:disabled { background: #2a2a38; }
  .networks {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px; margin-bottom: 18px;
  }
  .networks span {
    font-size: 12px; color: var(--muted); background: #0a0a0f;
    padding: 4px 10px; border-radius: 10px; border: 1px solid var(--border);
  }
  .status { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; margin-top: 12px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .options {
    display: flex; gap: 10px; margin-bottom: 14px; justify-content: center;
  }
  .options label {
    font-size: 13px; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .options input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
  .preview {
    margin-top: 16px; padding: 16px; background: #0a0a0f;
    border-radius: 14px; border: 1px solid var(--border); display: none;
  }
  .preview img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
  .preview h3 { font-size: 15px; margin-bottom: 4px; }
  .preview p { font-size: 13px; color: var(--muted); }
  .error { color: #ff453a; }
  .success { color: var(--success); }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo"><h1>Descargador Pro</h1></div>
    <div class="subtitle">Descarga videos y audio de cualquier red social</div>

    <div class="networks">
      <span>YouTube</span><span>TikTok</span><span>Instagram</span>
      <span>Facebook</span><span>X/Twitter</span><span>Reddit</span>
      <span>Twitch</span><span>Vimeo</span><span>+100 más</span>
    </div>

    <div class="input-row">
      <input type="text" id="url" placeholder="Pega el enlace aquí..." autocomplete="off">
      <button class="btn btn-primary" id="btnInfo" onclick="getInfo()">Ver info</button>
    </div>

    <div class="options">
      <label><input type="radio" name="tipo" value="video" checked> Video</label>
      <label><input type="radio" name="tipo" value="audio"> Audio MP3</label>
    </div>

    <button class="btn btn-download" id="btnDownload" onclick="startDownload()">Descargar</button>
    <div class="status" id="status"></div>

    <div class="preview" id="preview">
      <img id="thumb" src="" alt="">
      <h3 id="vtitle"></h3>
      <p id="vinfo"></p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');

function setStatus(html, cls='') {
    statusEl.innerHTML = html;
    statusEl.className = 'status ' + cls;
}

function getTipo() {
    return document.querySelector('input[name="tipo"]:checked').value;
}

async function getInfo() {
    const url = $('url').value.trim();
    if (!url) return setStatus('Pega una URL primero', 'error');
    setStatus('<span class="spinner"></span> Analizando...');
    $('btnInfo').disabled = true;

    try {
        const r = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
        if (!r.ok) throw new Error((await r.json()).error);
        const d = await r.json();
        $('preview').style.display = 'block';
        $('thumb').src = d.thumbnail || '';
        $('vtitle').textContent = d.title || 'Sin título';
        const m = Math.floor((d.duration||0)/60), s = String(Math.floor((d.duration||0)%60)).padStart(2,'0');
        $('vinfo').textContent = `${d.platform} • ${d.uploader||'Unknown'} • ${m}:${s}`;
        setStatus('Listo para descargar', 'success');
    } catch (e) {
        setStatus('Error: ' + e.message, 'error');
        $('preview').style.display = 'none';
    } finally {
        $('btnInfo').disabled = false;
    }
}

async function startDownload() {
    const url = $('url').value.trim();
    if (!url) return setStatus('Pega una URL primero', 'error');
    setStatus('<span class="spinner"></span> Descargando...');
    $('btnDownload').disabled = true;

    try {
        const r = await fetch('/api/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, tipo: getTipo() })
        });
        if (!r.ok) {
            const j = await r.json().catch(()=>({}));
            throw new Error(j.error || 'Error desconocido');
        }
        const blob = await r.blob();
        const disp = r.headers.get('content-disposition') || '';
        const m = disp.match(/filename="([^"]+)"/);
        const name = m ? decodeURIComponent(m[1]) : 'descarga';

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        setStatus('Descarga completada ✓', 'success');
    } catch (e) {
        setStatus('Error: ' + e.message, 'error');
    } finally {
        $('btnDownload').disabled = false;
    }
}

$('url').addEventListener('keypress', e => { if (e.key === 'Enter') getInfo(); });
</script>
</body>
</html>
