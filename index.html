<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b; --surface: #18181b; --border: #27272a;
            --text: #fafafa; --text-dim: #a1a1aa;
            --primary: #8b5cf6; --primary-hover: #7c3aed;
            --danger: #ef4444; --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        /* Contenedor Principal */
        .glass-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%; max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(to right, #a855f7, #ec4899); -webkit-background-clip: text; color: transparent; margin-bottom: 8px; }
        .header p { color: var(--text-dim); font-size: 0.95rem; }

        /* Input y Botón */
        .input-group { display: flex; gap: 12px; margin-bottom: 25px; position: relative; }
        input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; color: var(--text); font-size: 1rem; transition: all 0.3s ease; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        button { border: none; border-radius: 12px; padding: 0 28px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Tarjeta de Resultados */
        .result-card { display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 20px; animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .media-info { display: flex; gap: 16px; margin-bottom: 20px; }
        .thumbnail { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; background: var(--border); }
        .details { flex: 1; overflow: hidden; }
        .title { font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .platform-badge { display: inline-block; background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Controles de Descarga */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--text); font-size: 0.9rem; outline: none; cursor: pointer; appearance: none; }
        .btn-download { grid-column: span 2; background: linear-gradient(to right, #10b981, #059669); padding: 16px; color: white; border-radius: 12px; font-size: 1.1rem; }
        .btn-download:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Notificaciones (Toast) */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--danger); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4); }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Animación de Carga */
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) { .input-group { flex-direction: column; } button { padding: 16px; } .media-info { flex-direction: column; align-items: center; text-align: center; } .thumbnail { width: 100%; height: 180px; } }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="header">
            <h1>Downloader Pro</h1>
            <p>Extrae video y audio en máxima calidad de cualquier plataforma</p>
        </div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Pega el enlace aquí (TikTok, YouTube, IG...)" autocomplete="off">
            <button id="analyzeBtn" class="btn-primary" onclick="analyzeUrl()">
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnText">Analizar</span>
            </button>
        </div>

        <div id="resultCard" class="result-card">
            <div class="media-info">
                <img id="thumbImage" class="thumbnail" src="" alt="Miniatura">
                <div class="details">
                    <div id="mediaTitle" class="title">Título del video</div>
                    <span id="platformTag" class="platform-badge">Plataforma</span>
                </div>
            </div>

            <div class="controls">
                <select id="typeSelect" onchange="updateQualities()">
                    <option value="video">Formato: Video (MP4)</option>
                    <option value="audio">Formato: Audio (MP3)</option>
                </select>
                <select id="qualitySelect"></select>
                <button class="btn-download" onclick="startDownload()">↓ Descargar Archivo</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Error en la descarga</div>

    <script>
        let currentData = null;
        let originalUrl = '';

        const ui = {
            input: document.getElementById('urlInput'),
            btn: document.getElementById('analyzeBtn'),
            spinner: document.getElementById('btnSpinner'),
            btnText: document.getElementById('btnText'),
            card: document.getElementById('resultCard'),
            toast: document.getElementById('toast'),
            typeSel: document.getElementById('typeSelect')
        };

        function showToast(message, isError = true) {
            ui.toast.textContent = message;
            ui.toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
            ui.toast.classList.add('show');
            setTimeout(() => ui.toast.classList.remove('show'), 4000);
        }

        function setLoading(isLoading) {
            ui.btn.disabled = isLoading;
            ui.input.disabled = isLoading;
            ui.spinner.style.display = isLoading ? 'block' : 'none';
            ui.btnText.textContent = isLoading ? 'Procesando...' : 'Analizar';
            if (isLoading) ui.card.style.display = 'none';
        }

        async function analyzeUrl() {
            const url = ui.input.value.trim();
            if (!url) return showToast("Por favor, pega un enlace válido.");
            
            originalUrl = url;
            setLoading(true);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                currentData = data;
                renderData(data);
            } catch (error) {
                showToast(error.message || "Error al conectar con el servidor.");
            } finally {
                setLoading(false);
            }
        }

        function renderData(data) {
            document.getElementById('mediaTitle').textContent = data.titulo;
            document.getElementById('platformTag').textContent = data.plataforma;
            document.getElementById('thumbImage').src = data.thumbnail || '';
            
            ui.typeSel.innerHTML = '';
            if (data.puedeVideo) ui.typeSel.innerHTML += `<option value="video">Formato: Video (MP4)</option>`;
            if (data.puedeAudio) ui.typeSel.innerHTML += `<option value="audio">Formato: Audio (MP3)</option>`;
            
            updateQualities();
            ui.card.style.display = 'block';
        }

        function updateQualities() {
            const type = ui.typeSel.value;
            const select = document.getElementById('qualitySelect');
            select.innerHTML = '<option value="best">🏆 Mejor calidad (Automático)</option>';
            
            const list = type === 'video' ? currentData.formatos.videos : currentData.formatos.audios;
            
            // Filtramos duplicados para no abrumar al usuario
            const uniqueQualities = new Set();
            list.forEach(f => {
                if (!uniqueQualities.has(f.calidad)) {
                    uniqueQualities.add(f.calidad);
                    select.innerHTML += `<option value="${f.id}">${f.calidad}</option>`;
                }
            });
        }

        function startDownload() {
            const formatId = document.getElementById('qualitySelect').value;
            const type = ui.typeSel.value;
            showToast("Preparando archivo. La descarga iniciará en breve...", false);
            
            const params = new URLSearchParams({ url: originalUrl, formatId, tipo: type });
            window.location.href = `/api/download?${params.toString()}`;
        }

        ui.input.addEventListener('keypress', e => { if (e.key === 'Enter') analyzeUrl(); });
    </script>
</body>
</html>
