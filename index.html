<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de Videos y Fotos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e2f; 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { 
            background: #2a2a40; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 100%; 
            max-width: 500px; 
        }
        h1 { margin-bottom: 10px; font-size: 28px; }
        p.subtitle { margin-bottom: 25px; color: #a0a0b5; font-size: 14px; }
        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; 
            border: 1px solid #444466; border-radius: 8px; 
            background-color: #1e1e2f; color: white; font-size: 16px; outline: none;
        }
        input:focus { border-color: #007bff; }
        button { 
            background-color: #007bff; color: white; border: none; 
            padding: 15px; font-size: 16px; border-radius: 8px; 
            cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #estado { margin-top: 15px; font-size: 14px; height: 20px; }
        .success { color: #4CAF50; }
        .error { color: #ff4d4d; }
        
        /* Panel de opciones tras el análisis */
        .info-panel {
            background-color: #1e1e2f;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            text-align: left;
        }
        .info-panel h3 { font-size: 16px; margin-bottom: 5px; color: #e0e0e0; }
        .info-panel p { font-size: 13px; color: #8888a0; margin-bottom: 15px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        
        .btn-green { background-color: #4CAF50; }
        .btn-green:hover { background-color: #45a049; }
        .btn-orange { background-color: #ff9800; }
        .btn-orange:hover { background-color: #e68a00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Descargador Pro</h1>
        <p class="subtitle">Soporta videos normales y carruseles de fotos</p>
        
        <input type="text" id="urlInput" placeholder="Pega el enlace aquí...">
        <button id="btnAnalizar" onclick="analizarEnlace()">Analizar Enlace</button>
        <div id="estado"></div>

        <div id="panelOpciones" class="info-panel">
            <h3 id="txtTitulo">Título...</h3>
            <p id="txtAutor">Autor...</p>
            <div id="botonesDinamicos" class="btn-group">
                <!-- Los botones se insertan aquí mediante JavaScript -->
            </div>
        </div>
    </div>

    <script>
        let urlGlobal = "";

        async function analizarEnlace() {
            const url = document.getElementById('urlInput').value;
            const estadoDiv = document.getElementById('estado');
            const panelOpciones = document.getElementById('panelOpciones');
            const btnAnalizar = document.getElementById('btnAnalizar');

            if (!url) {
                estadoDiv.innerHTML = '<span class="error">Por favor, ingresa un enlace.</span>';
                return;
            }

            urlGlobal = url;
            btnAnalizar.disabled = true;
            panelOpciones.style.display = 'none';
            estadoDiv.innerHTML = '<span style="color:#a0a0b5;">Escaneando publicación... esto puede tardar unos segundos.</span>';

            try {
                const respuesta = await fetch('http://localhost:3000/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await respuesta.json();

                if (data.error) {
                    const extra = data.detalle ? ` (${data.detalle})` : '';
                    estadoDiv.innerHTML = `<span class="error">${data.error}${extra}</span>`;
                } else {
                    estadoDiv.innerHTML = '<span class="success">¡Análisis completado!</span>';
                    mostrarOpciones(data);
                }
            } catch (error) {
                estadoDiv.innerHTML = '<span class="error">Error de conexión con el servidor.</span>';
            } finally {
                btnAnalizar.disabled = false;
            }
        }

        function mostrarOpciones(data) {
            document.getElementById('txtTitulo').innerText = data.titulo;
            document.getElementById('txtAutor').innerText = "Por: " + data.autor;
            
            const contenedorBotones = document.getElementById('botonesDinamicos');
            contenedorBotones.innerHTML = "";

            if (data.esCarrusel) {
                contenedorBotones.innerHTML = `
                    <p style="color:#a0a0b5;font-size:12px;margin-bottom:5px;">📸 ${data.cantidad} elementos detectados</p>
                    <button class="btn-orange" onclick="descargarComoZip()">🖼️ Descargar Fotos (ZIP)</button>
                    <button class="btn-orange" onclick="descargarSlideshow()">🎬 Convertir a Video (MP4)</button>
                `;
            } else {
                contenedorBotones.innerHTML = `
                    <button class="btn-green" onclick="descargarVideoNormal()">⬇️ Descargar Video (MP4)</button>
                `;
            }

            document.getElementById('panelOpciones').style.display = 'block';
        }

        function descargarVideoNormal() {
            const estadoDiv = document.getElementById('estado');
            estadoDiv.innerHTML = '<span class="success">Iniciando descarga...</span>';
            window.location.href = `http://localhost:3000/api/download-video?url=${encodeURIComponent(urlGlobal)}`;
        }

        function descargarComoZip() {
            const estadoDiv = document.getElementById('estado');
            estadoDiv.innerHTML = '<span class="success">Empaquetando fotos en ZIP...</span>';
            window.location.href = `http://localhost:3000/api/download-images?url=${encodeURIComponent(urlGlobal)}`;
        }

        function descargarSlideshow() {
            const estadoDiv = document.getElementById('estado');
            estadoDiv.innerHTML = '<span style="color:#a0a0b5;">Generando video con audio... esto puede tardar un poco.</span>';
            window.location.href = `http://localhost:3000/api/download-slideshow?url=${encodeURIComponent(urlGlobal)}`;
        }
    </script>
</body>
</html>
